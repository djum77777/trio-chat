<title>Trio Chat — Mindy, Cheffy & Funny</title>
<style>
*,*::before,*::after{box-sizing:border-box}

body{font-family:'Baloo 2','Comic Sans MS','Chalkboard SE',system-ui,sans-serif;background:linear-gradient(135deg,#ffe29f 0%,#ffa99f 45%,#a0c4ff 100%) fixed;color:#2b2140;margin:0 auto;padding:20px;max-width:1320px;width:100%;min-height:100vh}

.setup-controls{align-items:center;padding:14px;background:#ffffffb8;border:3px solid #fff;border-radius:24px;box-shadow:0 8px 22px #40214a1f}

.face{width:150px;height:150px;margin:0 auto;display:block;overflow:visible}
.bob{transform-origin:75px 140px;transform-box:view-box}
.eyes{animation:blink 4.5s infinite;transform-origin:75px 82px;transform-box:view-box}

.thinking .pupils{animation:look 1.6s ease-in-out infinite}
.speaking .bob{animation:bounce .45s ease-in-out infinite}
.speaking .mouth-o{animation:talk .18s infinite alternate}
.dots{opacity:0}.thinking .dots{opacity:1}
.dots circle{fill:#2b2140;animation:dot 1.2s infinite}.dots circle:nth-child(2){animation-delay:.2s}.dots circle:nth-child(3){animation-delay:.4s}
#c-Mindy .eyes{animation-duration:6s}
#c-Funny .bob{animation:bounce 1.6s ease-in-out infinite}
#c-Funny.speaking .bob{animation-duration:.4s}
#c-Funny .eye-r{animation:wink 5s infinite;transform-origin:92px 82px;transform-box:view-box}

@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.08)}}
@keyframes wink{0%,70%,80%,100%{transform:scaleY(1)}74%,76%{transform:scaleY(.08)}}
@keyframes look{0%,100%{transform:translate(0,-5px)}40%{transform:translate(-5px,-6px)}70%{transform:translate(5px,-4px)}}
@keyframes talk{from{transform:scaleY(.35)}to{transform:scaleY(1.4)}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes wobble{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}

.name{font-weight:800;font-size:22px;color:var(--c)}.role{font-size:13px;opacity:.75}
.state{display:inline-block;margin-top:6px;padding:2px 12px;border-radius:999px;background:var(--c);color:#fff;font-weight:700;font-size:12px;letter-spacing:1px}
#sub{margin:22px 0 8px;min-height:56px;font-size:21px;font-weight:700;background:#fffe;padding:12px 18px;border-radius:24px;text-align:center;box-shadow:0 6px 0 #0001;overflow-wrap:anywhere}
#sub.chinese-mode{display:none}
#status{font-size:13px;opacity:.7}#log{max-height:380px;overflow:auto;display:grid;gap:10px;background:#ffffffc9;border-radius:22px;padding:12px}h3{color:#fff;text-shadow:0 2px 0 #0002}
#log .log-entry{margin:0;overflow-wrap:anywhere;white-space:normal;padding:12px 14px;border-left:6px solid var(--c);border-radius:15px;background:#fff;box-shadow:0 3px 10px #35214b12}
#log .log-head{display:flex;align-items:center;gap:8px;margin:0 0 6px;font-size:17px;line-height:1.1}#log .log-head b{color:var(--c)}
#log .log-cn{margin:0;font-size:17px;line-height:1.55;color:#2b2140}
#log .log-main{margin:0;line-height:1.45}#log .log-user{--c:#e07b00}#log .log-system{--c:#d13;background:#fff4f6}
.mouth-s{transform-origin:75px 112px;transform-box:view-box;transition:transform .08s}
.card.synced.speaking .mouth-o{animation:none}
.speaking .bob{animation:squash .42s ease-in-out infinite!important}
@keyframes squash{0%,100%{transform:translateY(0) scale(1,1)}30%{transform:translateY(-7px) scale(.95,1.06)}60%{transform:translateY(1px) scale(1.06,.94)}}
.ant{transform-origin:40px 86px;transform-box:view-box;animation:ant 3.2s ease-in-out infinite}
#c-Cheffy .ant{animation-delay:-1s}#c-Funny .ant{animation-duration:1.8s}
.speaking .ant{animation-duration:.6s}
@keyframes ant{0%,100%{transform:rotate(0)}40%{transform:rotate(-7deg)}70%{transform:rotate(4deg)}}
.card.nod .face{animation:nod .6s ease-in-out}@keyframes nod{30%{transform:translateY(5px) rotate(2deg)}60%{transform:translateY(-2px)}}
.card.giggle .face{animation:gig .7s ease-in-out}@keyframes gig{20%{transform:rotate(-8deg)}40%{transform:rotate(8deg)}60%{transform:rotate(-6deg)}80%{transform:rotate(5deg)}}
.card.cheer .face{animation:cheer .5s ease-in-out 4}@keyframes cheer{50%{transform:translateY(-22px) scale(1.08)}}
.brows path,.mouth-s,.blush,.tear{transition:transform .25s,opacity .25s}.brows path{transform-box:fill-box;transform-origin:center}
.emotion-amused .eyes,.emotion-excited .eyes,.emotion-worried .eyes,.emotion-surprised .eyes,.emotion-sad .eyes,.emotion-whispering .eyes,.emotion-skeptical .eyes{animation:none}
.blush,.tear{opacity:0}.emotion-amused .blush,.emotion-excited .blush{opacity:.65}
.emotion-amused .eyes{transform:scaleY(.68)}.emotion-amused .mouth-s{transform:scale(1.18,1.28)}
.emotion-excited .eyes{transform:scale(1.12)}.emotion-excited .bob{animation:bounce .32s ease-in-out infinite}

.emotion-surprised .eyes{transform:scale(1.18)}.emotion-surprised .mouth-s{transform:scale(1.35,1.55)}

.wait-scene{position:absolute;left:12px;top:8px;font-size:25px;opacity:0;transform:translateY(5px) scale(.7);transition:.3s;pointer-events:none}
.thinking .wait-scene{opacity:1;transform:none;animation:work 1.15s ease-in-out infinite}.thinking.longwait .wait-scene{animation-duration:.65s}
@keyframes work{50%{transform:translateY(-5px) rotate(7deg)}}
.stage.enter .card{animation:enter .8s cubic-bezier(.34,1.8,.5,1) both;animation-delay:calc(var(--i)*.15s)}
@keyframes enter{0%{transform:translateY(-120px) scale(.4) rotate(-15deg);opacity:0}100%{opacity:1}}
.thinking .face{animation:thinkb 1.4s ease-in-out infinite}@keyframes thinkb{50%{transform:translateY(-4px) rotate(-3deg)}}

.pupils{transition:transform .35s cubic-bezier(.34,1.6,.5,1)}

.voice-controls{padding:12px;background:#ffffff75;border-radius:20px}.recrow{display:flex;align-items:center;gap:10px;background:#fffc;border-radius:14px;padding:6px 12px;margin:4px 0;font-size:14px}

.scene-long:before{content:'✦　·　✧　　　·　✦　　✧　·';position:absolute;top:20px;left:6%;right:6%;color:#fff4a8;font-size:22px;letter-spacing:13px;opacity:.9;animation:twinkle 2.4s ease-in-out infinite alternate}

@keyframes twinkle{to{opacity:.35;filter:brightness(1.7)}}
.opening{position:absolute;inset:0;z-index:30;display:grid;place-items:center;overflow:hidden;border-radius:29px;opacity:0;visibility:hidden;transition:opacity .35s,visibility .35s;background:#18102b}

function startBubbleCaptions(a,text){const el=$('b-'+a.name),pages=captionPages(text);let i=0,timer=null;const paint=()=>{if(!running||i>=pages.length)return;const page=pages[i++];el.textContent=page;el.classList.remove('caption-swap');void el.offsetWidth;el.classList.add('caption-swap');const spokenLine=page.split('\n')[0],han=(spokenLine.match(/[\u3400-\u9fff]/g)||[]).length,words=spokenLine.split(/\s+/).filter(Boolean).length,delay=Math.min(6000,Math.max(2200,han?han*170:words*330));if(i<pages.length)timer=setTimeout(paint,delay)};paint();return()=>{clearTimeout(timer);el.classList.remove('caption-swap')}}

  $('status').textContent=`${a.name} is speaking`+poolStatus(pool);
  const tV=Date.now();duckBgm(true);try{await speak(a,out.text,lang,emotion)}finally{stopCaptions()}const voiceS=(Date.now()-tV)/1000;$('timing').style.display='block';$('timing').textContent=a.name+': thinking '+thinkS.toFixed(1)+'s'+(out.ms?' (server '+(out.ms/1000).toFixed(1)+'s)':'')+' - voice '+voiceS.toFixed(1)+'s';setEmotion(a,'neutral');speaker=null;const own=pool.get(a.name);if(own)waitingVisual(own);else setState(a,'READY');if(handRaised)activateRaisedHand();duckBgm(micMode==='live'||holdListening,holdListening);await waitForFloor();if(!running)break;await sleep(rnd(120,260))}
 const finished=running;stop(true);if(finished&&cleanEnd&&transcript.length>2)celebrate()}
function celebrate(){AGENTS.forEach((a,k)=>setTimeout(()=>{confetti(a);giggle(a)},k*250));$('sub').classList.remove('chinese-mode');$('sub').textContent="🎉 That's a wrap! 🎉";
 for(const a of AGENTS)card(a).classList.add('cheer');setTimeout(()=>AGENTS.forEach(a=>card(a).classList.remove('cheer')),2400)}
function stop(done){running=false;roomEpoch++;cancelAsks();stopPlayback();stopBgm();if(micMode==='live'||holdListening||handRaised)stopAllRec();clearInterval(reactT);speaker=null;livePool=null;liveRefreshForUser=null;mustAnswerUserId=0;allowQueuedBeforeUser=false;$('cards').classList.remove('live');
 AGENTS.forEach(a=>{setState(a,'READY');setEmotion(a,'neutral');lookAt(a,null)});$('start').disabled=false;$('stop').disabled=true;
 if(!done)$('status').textContent='Stopped.';else if(!$('status').textContent.startsWith('Error'))$('status').textContent='Conversation finished.'}
/* ---------- Voice Lab: record + store on server ---------- */
let mediaRec=null,recChunks=[],recStream=null;
$('rec').onclick=async()=>{
 if(mediaRec&&mediaRec.state==='recording'){mediaRec.stop();return}
 if(!navigator.mediaDevices||!window.MediaRecorder){$('recstate').textContent='Recording not supported in this browser.';return}
 try{recStream=await navigator.mediaDevices.getUserMedia({audio:true})}catch(e){$('recstate').textContent='Mic blocked: '+e.message;return}
 recChunks=[];mediaRec=new MediaRecorder(recStream);
 mediaRec.ondataavailable=e=>{if(e.data.size)recChunks.push(e.data)};
 mediaRec.onstop=async()=>{$('rec').classList.remove('onrec');$('rec').textContent='Record';
  const blob=new Blob(recChunks,{type:mediaRec.mimeType||'audio/webm'});recStream.getTracks().forEach(t=>t.stop());recStream=null;
  $('recstate').textContent='Saving '+Math.round(blob.size/1024)+'KB...';
  try{const r=await fetch('/api/recordings?agent='+encodeURIComponent($('recagent').value)+'&label='+encodeURIComponent($('reclabel').value||''),
    {method:'POST',headers:{'Content-Type':mediaRec.mimeType||'audio/webm'},body:blob});
   const j=await r.json().catch(()=>({}));$('recstate').textContent=r.ok?'Saved and assigned to '+$('recagent').value:'Error: '+(j.error||r.status)}
  catch(e){$('recstate').textContent='Upload failed: '+e.message}
  loadRecs()};
 mediaRec.start();$('rec').classList.add('onrec');$('rec').textContent='Stop recording';$('recstate').textContent='Recording... speak now'};
let recAudio=null;
async function loadRecs(){try{const j=await(await fetch('/api/recordings')).json();const l=j.recordings||[];
 $('reclist').innerHTML=l.length?l.map(x=>`<div class="recrow"><button class="rplay" data-src="/api/recordings/${x.file}">Play</button><b>${x.agent}</b><span>${String(x.label||'').replace(/[<>&]/g,'')}</span><span class="rmeta">${new Date(x.at).toLocaleString()} - ${Math.round(x.bytes/1024)}KB</span><button class="rdel" data-file="${x.file}">Delete</button></div>`).join(''):'No recordings yet - pick a Mind, hit Record.'}
 catch{$('reclist').textContent='Could not load recordings.'}}
$('reclist').addEventListener('click',async e=>{const p=e.target.closest('.rplay'),d=e.target.closest('.rdel');
 if(p){if(recAudio)recAudio.pause();recAudio=new Audio(p.dataset.src);recAudio.play().catch(()=>{})}
 if(d&&confirm('Delete this recording?')){await fetch('/api/recordings?file='+encodeURIComponent(d.dataset.file),{method:'DELETE'});loadRecs()}});
loadRecs();
$('replylength').onchange=()=>{if($('replylength').value!=='short')$('fast').checked=false;applyScene($('replylength').value)};
$('fast').onchange=()=>{if($('fast').checked){$('replylength').value='short';applyScene('short')}};
$('lang').onchange=()=>{const L=$('lang').value,names={en:'English',id:'Bahasa Indonesia',zh:'简体中文'};$('miclang').value=L;$('fresh').checked=true;if(running)stop(false);$('status').textContent='Language set to '+names[L]+'. Press Start for a fresh conversation.'};
$('start').onclick=run;$('stop').onclick=()=>stop(false);
fetch('/api/health').then(r=>r.json()).then(h=>{serverTTS=!!h.tts;$('srvwrap').style.display=serverTTS?'flex':'none';
 if(h.mock)$('status').textContent='Running in MOCK mode (canned lines, no API key).';else if(serverTTS)$('status').textContent=`Server voice ready (${h.tts}${h.elModel?', '+h.elModel:''}).`}).catch(()=>{});
